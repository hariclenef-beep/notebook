<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notebook</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Inter', sans-serif;
    background:
        radial-gradient(circle at top left, rgba(160, 60, 255, .18), transparent 30%),
        #080808;
    color: #fff;
    min-height: 100vh;
}

button,
input,
textarea,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

/* APP */

.app {
    min-height: 100vh;
    padding-bottom: 90px;
}

/* HEADER */

.header {
    position: sticky;
    top: 0;
    z-index: 50;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    background: rgba(8,8,8,.82);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,.06);
}

.logo {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -1.4px;
    background: linear-gradient(90deg,#e66aff,#8d3dff,#ffffff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.logo small {
    display: block;
    font-size: 8px;
    letter-spacing: 3px;
    color: #888;
    background: none;
    -webkit-text-fill-color: #888;
    margin-top: -2px;
}

.header-actions {
    display: flex;
    gap: 10px;
}

.icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    border: 1px solid #272727;
    background: #141414;
    color: white;
    font-size: 19px;
}

/* MAIN */

.main {
    width: min(700px, 100%);
    margin: auto;
    padding: 20px 15px;
}

/* CATEGORIES */

.categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 15px;
}

.categories::-webkit-scrollbar {
    display: none;
}

.category {
    white-space: nowrap;
    padding: 10px 17px;
    border-radius: 22px;
    border: 1px solid #282828;
    background: #141414;
    color: #999;
    font-weight: 600;
}

.category.active {
    color: white;
    border-color: #a83dff;
    background: linear-gradient(135deg,#a83dff,#6822ad);
    box-shadow: 0 5px 25px rgba(154,50,255,.25);
}

/* POST */

.post {
    margin-bottom: 18px;
    border: 1px solid #242424;
    background: rgba(18,18,18,.92);
    border-radius: 20px;
    overflow: hidden;
}

.post-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px;
}

.avatar {
    width: 43px;
    height: 43px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg,#c64cff,#5420a8);
    font-weight: 800;
}

.user-info {
    flex: 1;
}

.username {
    font-weight: 700;
}

.time {
    font-size: 12px;
    color: #777;
    margin-top: 3px;
}

.post-menu {
    color: #777;
    font-size: 20px;
}

.post-text {
    padding: 0 15px 15px;
    line-height: 1.5;
    color: #e8e8e8;
}

.post-media {
    width: 100%;
    max-height: 600px;
    object-fit: cover;
    display: block;
    background: #050505;
}

.post-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 13px 15px;
}

.action {
    border: none;
    background: transparent;
    color: #aaa;
    font-size: 21px;
    padding: 5px;
}

.action.liked {
    color: #ff4d91;
}

.likes {
    font-size: 13px;
    color: #999;
    padding: 0 15px 12px;
}

/* CREATE */

.create-box {
    background: linear-gradient(145deg,#171017,#101010);
    border: 1px solid #292029;
    border-radius: 20px;
    padding: 17px;
    margin-bottom: 20px;
}

.create-top {
    display: flex;
    align-items: center;
    gap: 12px;
}

.create-input {
    flex: 1;
    border: 1px solid #292929;
    background: #101010;
    color: #aaa;
    padding: 13px 16px;
    border-radius: 25px;
    text-align: left;
}

.create-tools {
    display: flex;
    gap: 9px;
    margin-top: 13px;
}

.tool {
    flex: 1;
    padding: 10px;
    border-radius: 12px;
    border: 1px solid #292929;
    background: #131313;
    color: #bbb;
}

/* EMPTY */

.empty {
    text-align: center;
    padding: 80px 20px;
    color: #777;
}

.empty-icon {
    font-size: 55px;
    margin-bottom: 15px;
}

/* BOTTOM NAV */

.bottom-nav {
    position: fixed;
    z-index: 100;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
