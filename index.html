<!DOCTYPE html>

<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notebook</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #050507;
    --card: #101014;
    --card2: #17171d;
    --border: rgba(255,255,255,.09);
    --text: #fff;
    --muted: rgba(255,255,255,.52);
    --purple: #8b3cff;
    --purple2: #5417a1;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 10% 0%, rgba(125,45,220,.28), transparent 32%),
        radial-gradient(circle at 90% 80%, rgba(85,25,160,.16), transparent 30%);
    pointer-events: none;
    z-index: -1;
}

/* =========================
   NAVBAR
========================= */

.navbar {
    height: 70px;
    padding: 0 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(5,5,7,.82);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
}

.logo {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -1px;
}

.logo span {
    background: linear-gradient(90deg,#fff,#c889ff);
    -webkit-background-clip: text;
    color: transparent;
}

.search {
    width: 330px;
    height: 40px;
    padding: 0 15px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.06);
    color: white;
    outline: none;
}

.search:focus {
    border-color: var(--purple);
}

.profile-mini {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg,var(--purple),#32105e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    overflow: hidden;
}

.profile-mini img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* =========================
   LAYOUT
========================= */

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 30px 20px 110px;
}

.welcome {
    margin-bottom: 28px;
}

.welcome h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.welcome p {
    color: var(--muted);
}

/* =========================
   CATEGORIES
========================= */

.categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-bottom: 25px;
}

.category {
    border: 1px solid var(--border);
    background: rgba(255,255,255,.04);
    color: var(--muted);
    padding: 9px 18px;
    border-radius: 30px;
    cursor: pointer;
    white-space: nowrap;
}

.category.active {
    color: white;
    background: linear-gradient(135deg,var(--purple),var(--purple2));
    border-color: transparent;
}

/* =========================
   FEED
========================= */

.feed {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.post {
    background: linear-gradient(
        145deg,
        rgba(255,255,255,.075),
        rgba(255,255,255,.025)
    );
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    backdrop-filter: blur(15px);
}

.post-header {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 14px;
}

.avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg,#8c3cff,#32105e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    overflow: hidden;
    flex-shrink: 0;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.username {
    font-weight: 600;
}

.time {
    color: rgba(255,255,255,.35);
    font-size: 12px;
    margin-top: 3px;
}

.post-category {
    display: inline-block;
    padding: 5px 10px;
    margin-bottom: 12px;
    border-radius: 20px;
    background: rgba(139,60,255,.15);
    color: #c38cff;
    font-size: 12px;
}

.post-text {
    color: rgba(255,255,255,.84);
    line-height: 1.6;
    font-size: 15px;
    white-space: pre-wrap;
    margin-bottom: 15px;
}

.post-image {
    width: 100%;
    max-height: 500px;
    object-fit: cover;
    border-radius: 14px;
    margin-bottom: 15px;
    display: block;
}

.post-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    border-top: 1px solid rgba(255,255,255,.06);
    padding-top: 12px;
}

.post-action {
    border: none;
    background: transparent;
    color: rgba(255,255,255,.55);
    padding: 8px 10px;
    border-radius: 9px;
    cursor: pointer;
}

.post-action:hover {
    background: rgba(255,255,255,.07);
    color: white;
}

.post-action.liked {
    color: #b56cff;
}

.delete-button {
    margin-left: auto;
}

/* =========================
   COMMENTS
========================= */

.comments {
    display: none;
    margin-top: 14px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
}

.comments.open {
    display: block;
}

.comment {
    display: flex;
    gap: 9px;
    margin-bottom: 12px;
}

.comment-avatar {
    width: 30px;
    height: 30px;
    min-width: 30px;
    border-radius: 50%;
    background: #32105e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
}

.comment-content {
    background: rgba(255,255,255,.05);
    border-radius: 12px;
    padding: 8px 11px;
    flex: 1;
}

.comment-name {
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 3px;
}

.comment-text {
    font-size: 13px;
    color: rgba(255,255,255,.75);
}

.comment-form {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.comment-input {
    flex: 1;
    height: 40px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.04);
    color: white;
    padding: 0 12px;
    outline: none;
}

.comment-send {
    border: none;
    border-radius: 10px;
    padding: 0 14px;
    color: white;
    background: var(--purple);
    cursor: pointer;
}

/* =========================
   CREATE BUTTON
========================= */

.create {
    position: fixed;
    right: 30px;
    bottom: 30px;
    width: 58px;
    height: 58px;
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 28px;
    cursor: pointer;
    background: linear-gradient(135deg,var(--purple),var(--purple2));
    box-shadow: 0 10px 35px rgba(110,40,220,.4);
    z-index: 60;
}

.create:hover {
    transform: scale(1.05);
}

/* =========================
   MODALS
========================= */

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.74);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    background: #101014;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 25px 80px rgba(0,0,0,.6);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.modal-header h2 {
    font-size: 22px;
}

.close {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,.07);
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.post-input {
    width: 100%;
    min-height: 140px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: rgba(255,255,255,.04);
    color: white;
    padding: 15px;
    outline: none;
    font-family: inherit;
    font-size: 15px;
}

.modal-label {
    display: block;
    color: var(--muted);
    font-size: 13px;
    margin: 17px 0 8px;
}

.category-select,
.input {
    width: 100%;
    height: 44px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: #18181e;
    color: white;
    padding: 0 12px;
    outline: none;
}

.file-input {
    width: 100%;
    color: var(--muted);
}

.image-preview {
    display: none;
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 12px;
    margin-top: 10px;
}

.image-preview.show {
    display: block;
}

.publish {
    width: 100%;
    height: 48px;
    margin-top: 20px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg,var(--purple),var(--purple2));
    color: white;
    font-weight: 600;
    cursor: pointer;
}

/* =========================
   PROFILE
========================= */

.profile-page {
    display: none;
}

.profile-page.show {
    display: block;
}

.profile-card {
    background: rgba(255,255,255,.05);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 25px;
    text-align: center;
}

.profile-large {
    width: 90px;
    height: 90px;
    margin: auto auto 15px;
    border-radius: 50%;
    overflow: hidden;
    background: linear-gradient(135deg,var(--purple),#32105e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: bold;
}

.profile-large img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.profile-card h2 {
    margin-bottom: 5px;
}

.profile-card p {
    color: var(--muted);
    font-size: 14px;
}

.profile-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 20px;
}

.secondary-button {
    border: 1px solid var(--border);
    background: rgba(255,255,255,.05);
    color: white;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav {
    display: none;
}

/* =========================
   LOGIN
========================= */

.login-screen {
    position: fixed;
    inset: 0;
    background: #050507;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 500;
}

.login-screen.show {
    display: flex;
}

.login-box {
    width: 100%;
    max-width: 400px;
    background: #101014;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 30px;
}

.login-logo {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 10px;
}

.login-subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 25px;
}

.login-box .input {
    margin-bottom: 12px;
}

.login-button {
    width: 100%;
    height: 46px;
    border: none;
    border-radius: 11px;
    color: white;
    background: linear-gradient(135deg,var(--purple),var(--purple2));
    cursor: pointer;
    font-weight: bold;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .navbar {
        height: 62px;
        padding: 0 16px;
    }

    .logo {
        font-size: 21px;
    }

    .search {
        display: none;
    }

    .profile-mini {
        width: 36px;
        height: 36px;
    }

    .container {
        padding: 25px 15px 95px;
    }

    .welcome h1 {
        font-size: 27px;
    }

    .post {
        padding: 16px;
        border-radius: 15px;
    }

    .create {
        width: 54px;
        height: 54px;
        right: 18px;
        bottom: 72px;
    }

    .bottom-nav {
        position: fixed;
        display: flex;
        align-items: center;
        justify-content: space-around;
        bottom: 0;
        left: 0;
        right: 0;
        height: 58px;
        background: rgba(5,5,7,.94);
        backdrop-filter: blur(18px);
        border-top: 1px solid var(--border);
        z-index: 80;
    }

    .bottom-nav button {
        border: none;
        background: transparent;
        color: rgba(255,255,255,.5);
        font-size: 20px;
        cursor: pointer;
    }

    .bottom-nav button.active {
        color: #b56cff;
    }

    .modal {
        padding: 20px;
    }
}
</style>

</head>

<script>

/* =====================================================
   DADOS
===================================================== */

const STORAGE_POSTS = "notebook_posts_v2";
const STORAGE_USER = "notebook_user_v2";


let currentUser =
    JSON.parse(
        localStorage.getItem(STORAGE_USER)
    );


let posts =
    JSON.parse(
        localStorage.getItem(STORAGE_POSTS)
    ) || [];


/* =====================================================
   ELEMENTOS
===================================================== */

const feed =
    document.getElementById("feed");

const createModal =
    document.getElementById("createModal");

const profileModal =
    document.getElementById("profileModal");

const loginScreen =
    document.getElementById("loginScreen");

const postInput =
    document.getElementById("postInput");

const postCategory =
    document.getElementById("postCategory");

const imageInput =
    document.getElementById("imageInput");

const imagePreview =
    document.getElementById("imagePreview");

const searchInput =
    document.getElementById("searchInput");


/* =====================================================
   LOGIN
===================================================== */

function checkLogin() {

    if (!currentUser) {

        loginScreen.classList.add("show");

    } else {

        loginScreen.classList.remove("show");

        updateUserInterface();

    }

}


document
    .getElementById("loginButton")
    .addEventListener(
        "click",
        function() {

            const name =
                document
                    .getElementById("loginName")
                    .value
                    .trim();

            const username =
                document
                    .getElementById("loginUsername")
                    .value
                    .trim();


            if (!name || !username) {

                alert(
                    "Preenche o nome e o username."
                );

                return;

            }


            currentUser = {

                name: name,

                username:
                    username.startsWith("@")
                    ? username
                    : "@" + username,

                avatar: null

            };


            localStorage.setItem(
                STORAGE_USER,
                JSON.stringify(currentUser)
            );


            checkLogin();

        }
    );


/* =====================================================
   USER INTERFACE
===================================================== */

function updateUserInterface() {

    if (!currentUser) return;


    document
        .getElementById("welcomeTitle")
        .textContent =
            "Olá " +
            currentUser.name +
            " 👋";


    document
        .getElementById("profileName")
        .textContent =
            currentUser.name;


    document
        .getElementById("profileUsername")
        .textContent =
            currentUser.username;


    const mini =
        document.getElementById("profileMini");

    const large =
        document.getElementById("profileLarge");


    if (currentUser.avatar) {

        mini.innerHTML =
            `<img src="${currentUser.avatar}">`;

        large.innerHTML =
            `<img src="${currentUser.avatar}">`;

    } else {

        mini.textContent =
            currentUser.name
                .charAt(0)
                .toUpperCase();

        large.textContent =
            currentUser.name
                .charAt(0)
                .toUpperCase();

    }


    updatePostCount();

}


/* =====================================================
   POSTS
===================================================== */

function savePosts() {

    localStorage.setItem(
        STORAGE_POSTS,
        JSON.stringify(posts)
    );

}


function formatTime(timestamp) {

    const date =
        new Date(timestamp);

    return date.toLocaleString(
        "pt-PT",
        {
            day: "2-digit",
            month: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


function renderPosts() {

    feed.innerHTML = "";


    if (posts.length === 0) {

        feed.innerHTML = `

            <div class="post">

                <p class="post-text">
                    Ainda não existem publicações.
                    Sê o primeiro a publicar!
                </p>

            </div>

        `;

        updatePostCount();

        return;

    }


    const search =
        searchInput.value
            .toLowerCase()
            .trim();


    posts.forEach(post => {

        const content =
            (
                post.text +
                " " +
                post.category +
                " " +
                post.username
            )
            .toLowerCase();


        if (
            search &&
            !content.includes(search)
        ) {
            return;
        }


        const article =
            document.createElement("article");

        article.className = "post";

        article.dataset.id =
            post.id;

        article.dataset.category =
            post.category;


        let avatarHTML;


        if (post.avatar) {

            avatarHTML =
                `<img src="${post.avatar}">`;

        } else {

            avatarHTML =
                escapeHTML(
                    post.username
                        .charAt(0)
                        .toUpperCase()
                );

        }


        let imageHTML = "";

        if (post.image) {

            imageHTML = `

                <img
                    class="post-image"
                    src="${post.image}"
                    alt="Imagem da publicação"
                >

            `;

        }


        const commentsHTML =
            (post.comments || [])
            .map(comment => `

                <div class="comment">

                    <div class="comment-avatar">
                        ${escapeHTML(
                            comment.username
                                .charAt(0)
                                .toUpperCase()
                        )}
                    </div>

                    <div class="comment-content">

                        <div class="comment-name">
                            ${escapeHTML(
                                comment.username
                            )}
                        </div>

                        <div class="comment-text">
                            ${escapeHTML(
                                comment.text
                            )}
                        </div>

                    </div>

                </div>

            `)
            .join("");


        const liked =
            post.likedBy &&
            post.likedBy.includes(
                currentUser.username
            );


        const isMine =
            post.username ===
            currentUser.username;


        article.innerHTML = `

            <div class="post-header">

                <div class="avatar">
                    ${avatarHTML}
                </div>

                <div>

                    <div class="username">
                        ${escapeHTML(
                            post.username
                        )}
                    </div>

                    <div class="time">
                        ${formatTime(post.createdAt)}
                    </div>

                </div>

            </div>


            <span class="post-category">
                ${escapeHTML(post.category)}
            </span>


            <p class="post-text">
                ${escapeHTML(post.text)}
            </p>


            ${imageHTML}


            <div class="post-actions">

                <button
                    class="post-action like-button ${liked ? "liked" : ""}"
                >
                    ${liked ? "♥" : "♡"}
                    Gostar
                    (${post.likes || 0})
                </button>


                <button
                    class="post-action comment-button"
                >
                    💬 Comentar
                    (${(post.comments || []).length})
                </button>


                ${
                    isMine
                    ?
                    `
                    <button
                        class="post-action delete-button"
                    >
                        🗑 Apagar
                    </button>
                    `
                    :
                    ""
                }

            </div>


            <div class="comments">

                <div class="comments-list">
                    ${commentsHTML}
                </div>


                <div class="comment-form">

                    <input
                        class="comment-input"
                        placeholder="Escreve um comentário..."
                    >

                    <button class="comment-send">
                        Enviar
                    </button>

                </div>

            </div>

        `;


        feed.appendChild(article);


        attachPostEvents(
            article,
            post
        );

    });


    updatePostCount();

}


/* =====================================================
   POST EVENTS
===================================================== */

function attachPostEvents(
    article,
    post
) {

    const likeButton =
        article.querySelector(
            ".like-button"
        );


    const commentButton =
        article.querySelector(
            ".comment-button"
        );


    const comments =
        article.querySelector(
            ".comments"
        );


    const commentInput =
        article.querySelector(
            ".comment-input"
        );


    const commentSend =
        article.querySelector(
            ".comment-send"
        );


    const deleteButton =
        article.querySelector(
            ".delete-button"
        );


    /* LIKE */

    likeButton.addEventListener(
        "click",
        function() {

            if (!post.likedBy) {
                post.likedBy = [];
            }


            const index =
                post.likedBy.indexOf(
                    currentUser.username
                );


            if (index >= 0) {

                post.likedBy.splice(
                    index,
                    1
                );

                post.likes =
                    Math.max(
                        0,
                        (post.likes || 0) - 1
                    );

            } else {

                post.likedBy.push(
                    currentUser.username
                );

                post.likes =
                    (post.likes || 0) + 1;

            }


            savePosts();

            renderPosts();

        }
    );


    /* COMENTÁRIOS */

    commentButton.addEventListener(
        "click",
        function() {

            comments.classList.toggle(
                "open"
            );

        }
    );


    /* ENVIAR COMENTÁRIO */

    commentSend.addEventListener(
        "click",
        function() {

            const text =
                commentInput.value.trim();


            if (!text) return;


            if (!post.comments) {
                post.comments = [];
            }


            post.comments.push({

                username:
                    currentUser.username,

                text: text

            });


            savePosts();

            renderPosts();

        }
    );


    /* APAGAR */

    if (deleteButton) {

        deleteButton.addEventListener(
            "click",
            function() {

                const confirmed =
                    confirm(
                        "Apagar esta publicação?"
                    );


                if (!confirmed) return;


                posts =
                    posts.filter(
                        p =>
                            p.id !== post.id
                    );


                savePosts();

                renderPosts();

            }
        );

    }

}


/* =====================================================
   CREATE POST
===================================================== */

document
    .getElementById("publishButton")
    .addEventListener(
        "click",
        function() {

            const text =
                postInput.value.trim();


            if (!text) {

                alert(
                    "Escreve alguma coisa antes de publicar."
                );

                return;

            }


            const publish =
                function(imageData) {

                    const newPost = {

                        id:
                            Date.now(),

                        username:
                            currentUser.username,

                        avatar:
                            currentUser.avatar,

                        text: text,

                        category:
                            postCategory.value,

                        image:
                            imageData || null,

                        likes: 0,

                        likedBy: [],

                        comments: [],

                        createdAt:
                            new Date().toISOString()

                    };


                    posts.unshift(
                        newPost
                    );


                    savePosts();

                    renderPosts();


                    postInput.value = "";

                    postCategory.value =
                        "Tudo";

                    imageInput.value = "";

                    imagePreview.src = "";

                    imagePreview.classList.remove(
                        "show"
                    );


                    closeModal(
                        createModal
                    );

                };


            if (
                imageInput.files &&
                imageInput.files[0]
            ) {

                const reader =
                    new FileReader();


                reader.onload =
                    function(event) {

                        publish(
                            event.target.result
                        );

                    };


                reader.readAsDataURL(
                    imageInput.files[0]
                );

            } else {

                publish(null);

            }

        }
    );


/* =====================================================
   IMAGE PREVIEW
===================================================== */

imageInput.addEventListener(
    "change",
    function() {

        const file =
            this.files[0];


        if (!file) return;


        const reader =
            new FileReader();


        reader.onload =
            function(event) {

                imagePreview.src =
                    event.target.result;

                imagePreview.classList.add(
                    "show"
                );

            };


        reader.readAsDataURL(file);

    }
);

                        }

            }
        );

    });

function closeModal(modal) {

}

/* =====================================================
   EDIT PROFILE
===================================================== */

document
    .getElementById("editProfile")
    .addEventListener(
        "click",
        function() {

            document
                .getElementById("editName")
                .value =
                    currentUser.name;


            document
                .getElementById("editUsername")
                .value =
                    currentUser.username;


            openModal(profileModal);

        }
    );


document
    .getElementById("closeProfile")
    .addEventListener(
        "click",
        function() {

            closeModal(
                profileModal
            );

        }
    );


document
    .getElementById("saveProfile")
    .addEventListener(
        "click",
        function() {

            const name =
                document
                    .getElementById("editName")
                    .value
                    .trim();


            let username =
                document
                    .getElementById("editUsername")
                    .value
                    .trim();


            if (!name || !username) {

                alert(
                    "Preenche os dados."
                );

                return;

            }


            if (
                !username.startsWith("@")
            ) {

                username =
                    "@" + username;

            }


            const update =
                function(avatar) {

                    currentUser.name =
                        name;

                    currentUser.username =
                        username;


                    if (avatar) {

                        currentUser.avatar =
                            avatar;

                    }


                    localStorage.setItem(
                        STORAGE_USER,
                        JSON.stringify(
                            currentUser
                        )
                    );


                    posts.forEach(post => {

                        if (
                            post.username ===
                            currentUser.username
                        ) {

                            post.avatar =
                                currentUser.avatar;

                        }

                    });


                    savePosts();

                    updateUserInterface();

                    renderPosts();

                    closeModal(
                        profileModal
                    );

                };


            const file =
                document
                    .getElementById(
                        "profileImageInput"
                    )
                    .files[0];


            if (file) {

                const reader =
                    new FileReader();


                reader.onload =
                    event =>
                        update(
                            event.target.result
                        );


                reader.readAsDataURL(
                    file
                );

            } else {

                update(null);

            }

        }
    );

   LOGOUT
===================================================== */

document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        function() {

            localStorage.removeItem(

            currentUser = null;

            loginScreen.classList.add(
                "show"
            );

        }
    );


/* =====================================================
   POST COUNT
===================================================== */

function updatePostCount() {

    if (!currentUser) return;


    const count =
        posts.filter(
            post =>
                post.username ===
                currentUser.username
        ).length;


    document
        .getElementById("postCount")
        .textContent =
            count +
            (
                count === 1
                ? " publicação"
                : " publicações"
            );

}
