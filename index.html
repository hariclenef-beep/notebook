<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notebook</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(125, 55, 220, 0.35),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #16052b 0%,
            #08030f 45%,
            #020204 100%
        );
    color: white;
}

/* =========================
   NAVBAR
========================= */

.navbar {
    width: 100%;
    height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 6%;

    background: rgba(0, 0, 0, 0.18);
    backdrop-filter: blur(15px);

    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.logo {
    font-size: 27px;
    font-weight: 700;
    letter-spacing: -1px;
}

.logo span {
    background: linear-gradient(
        90deg,
        #ffffff,
        #c58cff
    );

    -webkit-background-clip: text;
    color: transparent;
}

.nav-buttons {
    display: flex;
    align-items: center;
    gap: 10px;
}

.nav-button {
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.8);

    padding: 9px 15px;
    border-radius: 10px;

    cursor: pointer;
    font-size: 14px;
}

.nav-button:hover {
    background: rgba(255,255,255,0.08);
    color: white;
}

/* =========================
   HERO
========================= */

.hero {
    min-height: calc(100vh - 72px);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 60px 20px;
}

.hero-content {
    width: 100%;
    max-width: 850px;

    text-align: center;
}

.hero h1 {
    font-size: clamp(
        48px,
        8vw,
        88px
    );

    line-height: 1;

    letter-spacing: -4px;

    margin-bottom: 22px;

    background: linear-gradient(
        100deg,
        #ffffff 10%,
        #d6a7ff 45%,
        #8d3cff 100%
    );

    -webkit-background-clip: text;
    color: transparent;
}

.hero p {
    max-width: 600px;

    margin: 0 auto 35px;

    color: rgba(255,255,255,0.65);

    font-size: 18px;
    line-height: 1.6;
}

/* =========================
   BUTTONS
========================= */

.buttons {
    display: flex;
    justify-content: center;
    gap: 12px;

    flex-wrap: wrap;
}

.primary {
    border: none;

    padding: 14px 25px;

    border-radius: 13px;

    color: white;

    font-size: 15px;
    font-weight: 600;

    cursor: pointer;

    background: linear-gradient(
        135deg,
        #8d3cff,
        #5b19a9
    );

    box-shadow:
        0 10px 30px rgba(117, 40, 220, 0.25);
}

.primary:hover {
    transform: translateY(-2px);
}

.secondary {
    border: 1px solid rgba(255,255,255,0.13);

    padding: 14px 25px;

    border-radius: 13px;

    color: white;

    font-size: 15px;

    background: rgba(255,255,255,0.05);

    backdrop-filter: blur(10px);

    cursor: pointer;
}

.secondary:hover {
    background: rgba(255,255,255,0.09);
}

/* =========================
   PREVIEW
========================= */

.preview {
    margin: 65px auto 0;

    max-width: 720px;

    height: 260px;

    border-radius: 22px;

    border: 1px solid rgba(255,255,255,0.1);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.08),
            rgba(255,255,255,0.025)
        );

    backdrop-filter: blur(18px);

    box-shadow:
        0 25px 70px rgba(0,0,0,0.45);

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    overflow: hidden;
}

.preview::before {
    content: "";

    position: absolute;

    width: 260px;
    height: 260px;

    background: #8b3dff;

    filter: blur(120px);

    opacity: .18;

    top: -120px;
    left: -80px;
}

.preview-content {
    position: relative;

    width: 80%;

    text-align: left;
}

.preview-line {
    height: 9px;

    background: rgba(255,255,255,0.12);

    border-radius: 20px;

    margin: 13px 0;
}

.preview-line.short {
    width: 55%;
}

.preview-line.medium {
    width: 75%;
}

/* =========================
   FOOTER
========================= */

footer {
    text-align: center;

    padding: 25px;

    color: rgba(255,255,255,0.35);

    font-size: 12px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    .navbar {
        height: 64px;
        padding: 0 20px;
    }

    .logo {
        font-size: 23px;
    }

    .nav-buttons {
        display: none;
    }

    .hero {
        min-height: calc(100vh - 64px);

        padding: 45px 18px;
    }

    .hero h1 {
        font-size: 55px;
        letter-spacing: -3px;
    }

    .hero p {
        font-size: 15px;
    }

    .buttons {
        flex-direction: column;
        width: 100%;
    }

    .primary,
    .secondary {
        width: 100%;
    }

    .preview {
        height: 190px;
        margin-top: 45px;
        border-radius: 18px;
    }

    .preview-content {
        width: 82%;
    }
}

</style>
</head>

<body>

<header class="navbar">

    <div class="logo">
        <span>Notebook</span>
    </div>

    <div class="nav-buttons">

        <button class="nav-button">
            Início
        </button>

        <button class="nav-button">
            Explorar
        </button>

        <button class="nav-button">
            Entrar
        </button>

    </div>

</header>


<main class="hero">

    <div class="hero-content">

        <h1>
            Notebook
        </h1>

        <p>
            O teu espaço para criar, partilhar
            e descobrir novas ideias.
        </p>

        <div class="buttons">

            <button class="primary">
                Começar
            </button>

            <button class="secondary">
                Explorar
            </button>

        </div>


        <div class="preview">

            <div class="preview-content">

                <div class="preview-line"></div>

                <div class="preview-line medium"></div>

                <div class="preview-line short"></div>

                <div class="preview-line"></div>

                <div class="preview-line medium"></div>

            </div>

        </div>

    </div>

</main>


<footer>

    Notebook

</footer>

</body>
</html>
