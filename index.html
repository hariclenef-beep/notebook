<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notebook</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #12001f, #050008 65%);
    color: white;
    min-height: 100vh;
}

button {
    font-family: inherit;
}

.app {
    max-width: 600px;
    margin: auto;
    min-height: 100vh;
    padding-bottom: 75px;
}

/* CABEÇALHO */

.header {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(8, 0, 15, 0.88);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.logo {
    font-size: 29px;
    font-weight: 700;
    letter-spacing: -1.5px;
    background: linear-gradient(90deg, #c77dff, #ffffff);
    -webkit-background-clip: text;
    color: transparent;
}

.header-icon {
    font-size: 23px;
    cursor: pointer;
}

/* CONTEÚDO */

.content {
    padding: 18px 12px;
}

.welcome {
    margin-bottom: 20px;
}

.welcome h1 {
    font-size: 24px;
}

.welcome p {
    color: #aaa;
    margin-top: 5px;
}

/* CRIAR PUBLICAÇÃO */

.create {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 15px;
    margin-bottom: 18px;
}

.create textarea {
    width: 100%;
    height: 70px;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 15px;
}

.create textarea::placeholder {
    color: #888;
}

.create-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.upload {
    cursor: pointer;
    color: #c77dff;
    font-size: 14px;
}

.upload input {
    display: none;
}

.post-button {
    border: none;
    padding: 9px 18px;
    border-radius: 20px;
    background: linear-gradient(90deg, #8b2cff, #c45cff);
    color: white;
    font-weight: bold;
    cursor: pointer;
}

/* PUBLICAÇÕES */

.post {
    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    margin-bottom: 18px;
    overflow: hidden;
}

.post-top {
    display: flex;
    align-items: center;
    padding: 14px;
    gap: 10px;
}

.avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8b2cff, #e05cff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.username {
    font-weight: bold;
}

.time {
    color: #777;
    font-size: 12px;
}

.post-text {
    padding: 0 15px 15px;
    line-height: 1.5;
}

.post-media {
    width: 100%;
    max-height: 600px;
    object-fit: cover;
    display: block;
}

.actions {
    display: flex;
    gap: 20px;
    padding: 13px 15px;
    font-size: 23px;
}

.actions span {
    cursor: pointer;
}

.likes {
    padding: 0 15px 14px;
    font-size: 14px;
}

/* MENU INFERIOR */

.bottom {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 65px;
    background: rgba(8,0,15,0.94);
    backdrop-filter: blur(15px);
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 20;
}

.bottom button {
    background: none;
    border: none;
    color: #888;
    font-size: 23px;
    cursor: pointer;
}

.bottom button.active {
    color: #c77dff;
}

/* PERFIL */

.profile {
    display: none;
    text-align: center;
    padding: 25px 15px;
}

.profile-avatar {
    width: 95px;
    height: 95px;
    border-radius: 50%;
    margin: auto;
    background: linear-gradient(135deg,#7928ff,#e45cff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: bold;
}

.profile h2 {
    margin-top: 15px;
}

.profile p {
    color: #999;
    margin-top: 5px;
}

.edit {
    margin-top: 18px;
    padding: 10px 25px;
    border-radius: 20px;
    border: 1px solid #7040a8;
    background: transparent;
    color: white;
}

/* RESPONSIVO */

@media (max-width: 600px) {
    .app {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <div class="logo">Notebook</div>
    <div class="header-icon">✦</div>
</header>

<main class="content" id="home">

    <div class="welcome">
        <h1>Bem-vindo à Notebook</h1>
        <p>Partilha momentos. Descobre pessoas.</p>
    </div>

    <section class="create">

        <textarea id="postText"
        placeholder="O que estás a pensar?"></textarea>

        <div id="preview"></div>

        <div class="create-bottom">

            <label class="upload">
                📷 Foto/Vídeo
                <input
                    type="file"
                    id="mediaInput"
                    accept="image/*,video/*">
            </label>

            <button class="post-button" onclick="createPost()">
                Publicar
            </button>

        </div>
    </section>

    <section id="feed">

        <article class="post">

            <div class="post-top">
                <div class="avatar">N</div>

                <div>
                    <div class="username">Notebook</div>
                    <div class="time">Agora</div>
                </div>
            </div>

            <div class="post-text">
                Bem-vindo à primeira versão da Notebook! 💜
            </div>

            <div class="actions">
                <span onclick="like(this)">♡</span>
                <span>💬</span>
                <span>↗</span>
            </div>

            <div class="likes">
                0 gostos
            </div>

        </article>

    </section>

</main>

<section class="profile" id="profile">

    <div class="profile-avatar">N</div>

    <h2>Meu perfil</h2>

    <p>@notebook_user</p>

    <button class="edit">
        Editar perfil
    </button>

</section>

<nav class="bottom">

    <button class="active" onclick="showHome(this)">
        🏠
    </button>

    <button onclick="showProfile(this)">
        👤
    </button>

    <button onclick="focusPost()">
        ＋
    </button>

</nav>

</div>

<script>

let selectedMedia = null;

/* SELECIONAR IMAGEM/VÍDEO */

document.getElementById("mediaInput").addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) return;

    selectedMedia = file;

    const preview = document.getElementById("preview");

    preview.innerHTML = "";

    const url = URL.createObjectURL(file);

    if (file.type.startsWith("image/")) {

        const img = document.createElement("img");

        img.src = url;
        img.style.width = "100%";
        img.style.maxHeight = "300px";
        img.style.objectFit = "cover";
        img.style.borderRadius = "12px";
        img.style.marginBottom = "12px";

        preview.appendChild(img);

    } else if (file.type.startsWith("video/")) {

        const video = document.createElement("video");

        video.src = url;
        video.controls = true;
        video.style.width = "100%";
        video.style.maxHeight = "300px";
        video.style.borderRadius = "12px";
        video.style.marginBottom = "12px";

        preview.appendChild(video);
    }
});


/* CRIAR PUBLICAÇÃO */

function createPost() {

    const text = document.getElementById("postText").value.trim();

    if (!text && !selectedMedia) {
        alert("Escreve alguma coisa ou escolhe uma imagem/vídeo.");
        return;
    }

    const post = document.createElement("article");

    post.className = "post";

    let mediaHTML = "";

    if (selectedMedia) {

        const url = URL.createObjectURL(selectedMedia);

        if (selectedMedia.type.startsWith("image/")) {

            mediaHTML =
            `<img class="post-media" src="${url}">`;

        } else {

            mediaHTML =
            `<video class="post-media" src="${url}" controls></video>`;
        }
    }

    post.innerHTML = `

        <div class="post-top">

            <div class="avatar">N</div>

            <div>
                <div class="username">Você</div>
                <div class="time">Agora</div>
            </div>

        </div>

        ${text ? `<div class="post-text">${escapeHTML(text)}</div>` : ""}

        ${mediaHTML}

        <div class="actions">
            <span onclick="like(this)">♡</span>
            <span>💬</span>
            <span>↗</span>
        </div>

        <div class="likes">
            0 gostos
        </div>
    `;

    document.getElementById("feed").prepend(post);

    document.getElementById("postText").value = "";

    document.getElementById("mediaInput").value = "";

    document.getElementById("preview").innerHTML = "";

    selectedMedia = null;
}


/* GOSTO */

function like(element) {

    if (element.innerHTML === "♡") {
        element.innerHTML = "♥";
    } else {
        element.innerHTML = "♡";
    }
}


/* NAVEGAÇÃO */

function showProfile(button) {

    document.getElementById("home").style.display = "none";

    document.getElementById("profile").style.display = "block";

    document.querySelectorAll(".bottom button")
    .forEach(b => b.classList.remove("active"));

    button.classList.add("active");
}


function showHome(button) {

    document.getElementById("home").style.display = "block";

    document.getElementById("profile").style.display = "none";

    document.querySelectorAll(".bottom button")
    .forEach(b => b.classList.remove("active"));

    button.classList.add("active");
}


function focusPost() {

    document.getElementById("home").style.display = "block";

    document.getElementById("profile").style.display = "none";

    document.getElementById("postText").focus();

}


/* SEGURANÇA DO TEXTO */

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

</script>

</body>
</html>
