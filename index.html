<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notebook</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #050507;
    color: white;
    min-height: 100vh;
}

/* FUNDO */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(
            circle at 15% 0%,
            rgba(125, 45, 220, .28),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(85, 25, 160, .16),
            transparent 30%
        );
    pointer-events: none;
    z-index: -1;
}

/* TOPO */

.navbar {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 5%;

    background: rgba(5, 5, 7, .75);
    backdrop-filter: blur(18px);

    border-bottom: 1px solid rgba(255,255,255,.08);

    position: sticky;
    top: 0;
    z-index: 20;
}

.logo {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -1px;
}

.logo span {
    background: linear-gradient(
        90deg,
        #ffffff,
        #c889ff
    );

    -webkit-background-clip: text;
    color: transparent;
}

/* PESQUISA */

.search {
    width: 330px;
    height: 40px;

    border-radius: 12px;

    border: 1px solid rgba(255,255,255,.1);

    background: rgba(255,255,255,.06);

    color: white;

    padding: 0 15px;

    outline: none;
}

.search::placeholder {
    color: rgba(255,255,255,.4);
}

.search:focus {
    border-color: rgba(160,90,255,.7);
}

/* PERFIL */

.profile {
    width: 40px;
    height: 40px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(
        135deg,
        #7b2cff,
        #32105e
    );

    font-weight: bold;
}

/* CONTEÚDO */

.container {
    width: 100%;
    max-width: 900px;

    margin: auto;

    padding: 30px 20px 100px;
}

/* CATEGORIAS */

.categories {
    display: flex;
    gap: 8px;

    margin-bottom: 30px;

    overflow-x: auto;
}

.category {
    border: 1px solid rgba(255,255,255,.1);

    background: rgba(255,255,255,.04);

    color: rgba(255,255,255,.65);

    padding: 9px 18px;

    border-radius: 30px;

    cursor: pointer;

    white-space: nowrap;
}

.category:hover {
    background: rgba(255,255,255,.08);
}

.category.active {
    color: white;

    background: linear-gradient(
        135deg,
        #7b2cff,
        #5319a0
    );

    border-color: transparent;
}

/* BEM-VINDO */

.welcome {
    margin-bottom: 30px;
}

.welcome h1 {
    font-size: 32px;

    margin-bottom: 8px;
}

.welcome p {
    color: rgba(255,255,255,.5);

    font-size: 15px;
}

/* FEED */

.feed {
    display: flex;
    flex-direction: column;

    gap: 16px;
}

/* PUBLICAÇÃO */

.post {
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border: 1px solid rgba(255,255,255,.09);

    border-radius: 18px;

    padding: 20px;

    backdrop-filter: blur(15px);
}

.post-header {
    display: flex;
    align-items: center;

    gap: 11px;

    margin-bottom: 17px;
}

.avatar {
    width: 40px;
    height: 40px;

    border-radius: 50%;

    background: linear-gradient(
        135deg,
        #8c3cff,
        #32105e
    );

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;
}

.username {
    font-weight: 600;
}

.time {
    color: rgba(255,255,255,.35);

    font-size: 12px;

    margin-top: 3px;
}

.post-text {
    color: rgba(255,255,255,.82);

    line-height: 1.6;

    font-size: 15px;

    margin-bottom: 18px;
}

/* IMAGEM DE EXEMPLO */

.post-image {
    width: 100%;

    height: 320px;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #35105f,
            #09030f
        );

    display: flex;

    align-items: center;
    justify-content: center;

    color: rgba(255,255,255,.35);

    margin-bottom: 15px;
}

/* AÇÕES */

.post-actions {
    display: flex;

    gap: 8px;
}

.post-action {
    border: none;

    background: transparent;

    color: rgba(255,255,255,.55);

    padding: 8px 12px;

    border-radius: 9px;

    cursor: pointer;
}

.post-action:hover {
    background: rgba(255,255,255,.07);

    color: white;
}

/* BOTÃO CRIAR */

.create {
    position: fixed;

    right: 30px;
    bottom: 30px;

    width: 58px;
    height: 58px;

    border: none;

    border-radius: 50%;

    color: white;

    font-size: 28px;

    cursor: pointer;

    background: linear-gradient(
        135deg,
        #8b3cff,
        #5417a1
    );

    box-shadow:
        0 10px 35px rgba(110,40,220,.4);

    z-index: 30;
}

.create:hover {
    transform: scale(1.05);
}

/* BARRA MOBILE */

.bottom-nav {
    display: none;
}

/* TABLET */

@media (max-width: 800px) {

    .search {
        width: 230px;
    }

}

/* TELEMÓVEL */

@media (max-width: 600px) {

    .navbar {
        height: 62px;

        padding: 0 16px;
    }

    .logo {
        font-size: 21px;
    }

    .search {
        display: none;
    }

    .profile {
        width: 36px;
        height: 36px;
    }

    .container {
        padding:
            25px
            15px
            90px;
    }

    .welcome h1 {
        font-size: 27px;
    }

    .post {
        padding: 16px;

        border-radius: 15px;
    }

    .post-image {
        height: 230px;
    }

    .create {
        width: 54px;
        height: 54px;

        right: 18px;
        bottom: 72px;
    }

    .bottom-nav {
        position: fixed;

        display: flex;

        align-items: center;
        justify-content: space-around;

        bottom: 0;
        left: 0;
        right: 0;

        height: 58px;

        background: rgba(5,5,7,.9);

        backdrop-filter: blur(18px);

        border-top: 1px solid rgba(255,255,255,.08);

        z-index: 20;
    }

    .bottom-nav button {
        border: none;

        background: transparent;

        color: rgba(255,255,255,.5);

        font-size: 20px;

        cursor: pointer;
    }

    .bottom-nav button.active {
        color: #b56cff;
    }

}

</style>
</head>

<body>


<!-- TOPO -->

<header class="navbar">

    <div class="logo">
        <span>Notebook</span>
    </div>

    <input
        class="search"
        type="text"
        placeholder="Pesquisar..."
    >

    <div class="profile">
        H
    </div>

</header>


<!-- CONTEÚDO -->

<main class="container">


    <!-- BEM-VINDO -->

    <section class="welcome">

        <h1>
            Olá 👋
        </h1>

        <p>
            Descobre o que está a acontecer na Notebook.
        </p>

    </section>


    <!-- CATEGORIAS -->

    <div class="categories">

        <button class="category active">
            Tudo
        </button>

        <button class="category">
            Anime
        </button>

        <button class="category">
            Desporto
        </button>

    </div>


    <!-- FEED -->

    <section class="feed">


        <!-- PUBLICAÇÃO 1 -->

        <article class="post">

            <div class="post-header">

                <div class="avatar">
                    N
                </div>

                <div>

                    <div class="username">
                        Notebook
                    </div>

                    <div class="time">
                        Agora
                    </div>

                </div>

            </div>


            <p class="post-text">

                Bem-vindo à Notebook.
                Este é o início de uma nova forma
                de partilhar as tuas ideias.

            </p>


            <div class="post-actions">

                <button class="post-action">
                    ♡ Gostar
                </button>

                <button class="post-action">
                    💬 Comentar
                </button>

                <button class="post-action">
                    ↗ Partilhar
                </button>

            </div>

        </article>


        <!-- PUBLICAÇÃO 2 -->

        <article class="post">

            <div class="post-header">

                <div class="avatar">
                    A
                </div>

                <div>

                    <div class="username">
                        Anime
                    </div>

                    <div class="time">
                        Há 5 min
                    </div>

                </div>

            </div>


            <p class="post-text">

                Espaço reservado para uma publicação.
                Em breve poderás adicionar imagens,
                vídeos e muito mais.

            </p>


            <div class="post-image">
                Imagem / vídeo
            </div>


            <div class="post-actions">

                <button class="post-action">
                    ♡ Gostar
                </button>

                <button class="post-action">
                    💬 Comentar
                </button>

                <button class="post-action">
                    ↗ Partilhar
                </button>

            </div>

        </article>


    </section>

</main>


<!-- BOTÃO CRIAR -->

<button class="create">
    +
</button>


<!-- NAVEGAÇÃO MOBILE -->

<nav class="bottom-nav">

    <button class="active">
        ⌂
    </button>

    <button>
        ◯
    </button>

    <button>
        ＋
    </button>

    <button>
        ♡
    </button>

    <button>
        ●
    </button>

</nav>


<script>

/* CATEGORIAS */

const categories =
    document.querySelectorAll(".category");

categories.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            categories.forEach(
                b => b.classList.remove("active")
            );

            button.classList.add("active");

        }
    );

});


/* BOTÃO CRIAR */

document
    .querySelector(".create")
    .addEventListener(
        "click",
        () => {

            alert(
                "Aqui vamos criar a publicação da Notebook."
            );

        }
    );

</script>

</body>
</html>
