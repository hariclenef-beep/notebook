<!DOCTYPE html>

<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notebook</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #050507;
    color: white;
    min-height: 100vh;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 15% 0%, rgba(125,45,220,.28), transparent 32%),
        radial-gradient(circle at 90% 80%, rgba(85,25,160,.16), transparent 30%);
    pointer-events: none;
    z-index: -1;
}

/* TOPO */

.navbar {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    background: rgba(5,5,7,.78);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(255,255,255,.08);
    position: sticky;
    top: 0;
    z-index: 20;
}

.logo {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -1px;
}

.logo span {
    background: linear-gradient(90deg,#fff,#c889ff);
    -webkit-background-clip: text;
    color: transparent;
}

.search {
    width: 330px;
    height: 40px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.06);
    color: white;
    padding: 0 15px;
    outline: none;
}

.search::placeholder {
    color: rgba(255,255,255,.4);
}

.search:focus {
    border-color: rgba(160,90,255,.7);
}

.profile {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg,#7b2cff,#32105e);
    font-weight: bold;
}

/* CONTEÚDO */

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 30px 20px 100px;
}

.welcome {
    margin-bottom: 30px;
}

.welcome h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.welcome p {
    color: rgba(255,255,255,.5);
    font-size: 15px;
}

/* CATEGORIAS */

.categories {
    display: flex;
    gap: 8px;
    margin-bottom: 30px;
    overflow-x: auto;
}

.category {
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(255,255,255,.04);
    color: rgba(255,255,255,.65);
    padding: 9px 18px;
    border-radius: 30px;
    cursor: pointer;
    white-space: nowrap;
}

.category.active {
    color: white;
    background: linear-gradient(135deg,#7b2cff,#5319a0);
    border-color: transparent;
}

/* FEED */

.feed {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.post {
    background: linear-gradient(
        145deg,
        rgba(255,255,255,.075),
        rgba(255,255,255,.025)
    );
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 18px;
    padding: 20px;
    backdrop-filter: blur(15px);
}

.post-header {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 17px;
}

.avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg,#8c3cff,#32105e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.username {
    font-weight: 600;
}

.time {
    color: rgba(255,255,255,.35);
    font-size: 12px;
    margin-top: 3px;
}

.post-category {
    display: inline-block;
    margin-bottom: 12px;
    padding: 5px 10px;
    border-radius: 20px;
    background: rgba(139,60,255,.15);
    color: #c38cff;
    font-size: 12px;
}

.post-text {
    color: rgba(255,255,255,.82);
    line-height: 1.6;
    font-size: 15px;
    margin-bottom: 18px;
    white-space: pre-wrap;
}

.post-actions {
    display: flex;
    gap: 8px;
    border-top: 1px solid rgba(255,255,255,.06);
    padding-top: 12px;
}

.post-action {
    border: none;
    background: transparent;
    color: rgba(255,255,255,.55);
    padding: 8px 12px;
    border-radius: 9px;
    cursor: pointer;
}

.post-action:hover {
    background: rgba(255,255,255,.07);
    color: white;
}

.post-action.liked {
    color: #b56cff;
}

/* BOTÃO + */

.create {
    position: fixed;
    right: 30px;
    bottom: 30px;
    width: 58px;
    height: 58px;
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 28px;
    cursor: pointer;
    background: linear-gradient(135deg,#8b3cff,#5417a1);
    box-shadow: 0 10px 35px rgba(110,40,220,.4);
    z-index: 30;
}

.create:hover {
    transform: scale(1.05);
}

/* MODAL */

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 520px;
    background: #101014;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 25px 80px rgba(0,0,0,.6);
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
}

.modal-header h2 {
    font-size: 22px;
}

.close {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,.07);
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.post-input {
    width: 100%;
    min-height: 150px;
    resize: vertical;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 14px;
    background: rgba(255,255,255,.04);
    color: white;
    padding: 15px;
    outline: none;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
}

.post-input::placeholder {
    color: rgba(255,255,255,.35);
}

.post-input:focus {
    border-color: #7b2cff;
}

.modal-label {
    display: block;
    color: rgba(255,255,255,.6);
    font-size: 13px;
    margin: 18px 0 8px;
}

.category-select {
    width: 100%;
    height: 45px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.1);
    background: #18181e;
    color: white;
    padding: 0 12px;
    outline: none;
}

.publish {
    width: 100%;
    height: 48px;
    margin-top: 20px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg,#8b3cff,#5417a1);
    color: white;
    font-weight: 600;
    cursor: pointer;
}

.publish:hover {
    filter: brightness(1.1);
}

/* NAVEGAÇÃO MOBILE */

.bottom-nav {
    display: none;
}

/* MOBILE */

@media (max-width: 600px) {

    .navbar {
        height: 62px;
        padding: 0 16px;
    }

    .logo {
        font-size: 21px;
    }

    .search {
        display: none;
    }

    .profile {
        width: 36px;
        height: 36px;
    }

    .container {
        padding: 25px 15px 90px;
    }

    .welcome h1 {
        font-size: 27px;
    }

    .post {
        padding: 16px;
        border-radius: 15px;
    }

    .create {
        width: 54px;
        height: 54px;
        right: 18px;
        bottom: 72px;
    }

    .bottom-nav {
        position: fixed;
        display: flex;
        align-items: center;
        justify-content: space-around;
        bottom: 0;
        left: 0;
        right: 0;
        height: 58px;
        background: rgba(5,5,7,.92);
        backdrop-filter: blur(18px);
        border-top: 1px solid rgba(255,255,255,.08);
        z-index: 20;
    }

    .bottom-nav button {
        border: none;
        background: transparent;
        color: rgba(255,255,255,.5);
        font-size: 20px;
        cursor: pointer;
    }

    .bottom-nav button.active {
        color: #b56cff;
    }

    .modal {
        padding: 20px;
        border-radius: 18px;
    }
}
</style>

</head>

<script>

const modalOverlay = document.getElementById("modalOverlay");
const createButton = document.getElementById("createButton");
const mobileCreate = document.getElementById("mobileCreate");
const closeModal = document.getElementById("closeModal");

const postInput = document.getElementById("postInput");
const postCategory = document.getElementById("postCategory");
const publishButton = document.getElementById("publishButton");

const feed = document.getElementById("feed");

const categories =
    document.querySelectorAll(".category");


/* ABRIR MODAL */

function openModal() {

    modalOverlay.classList.add("show");

    setTimeout(() => {
        postInput.focus();
    }, 100);

}


/* FECHAR MODAL */

function closeCreateModal() {

    modalOverlay.classList.remove("show");

}


/* BOTÕES */

createButton.addEventListener(
    "click",
    openModal
);

mobileCreate.addEventListener(
    "click",
    openModal
);

closeModal.addEventListener(
    "click",
    closeCreateModal
);


/* FECHAR AO CLICAR FORA */

modalOverlay.addEventListener(
    "click",
    function(event) {

        if (event.target === modalOverlay) {
            closeCreateModal();
        }

    }
);


/* CRIAR PUBLICAÇÃO */

publishButton.addEventListener(
    "click",
    function() {

        const text =
            postInput.value.trim();

        const category =
            postCategory.value;


        if (!text) {

            alert(
                "Escreve alguma coisa antes de publicar."
            );

            postInput.focus();

            return;

        }


        const post =
            document.createElement("article");

        post.className = "post";

        post.dataset.category = category;

        post.innerHTML = `

            <div class="post-header">

                <div class="avatar">
                    H
                </div>

                <div>

                    <div class="username">
                        Hariclene
                    </div>

                    <div class="time">
                        Agora
                    </div>

                </div>

            </div>

            <span class="post-category">
                ${category}
            </span>

            <p class="post-text"></p>

            <div class="post-actions">

                <button class="post-action like-button">
                    ♡ Gostar
                </button>

                <button class="post-action">
                    💬 Comentar
                </button>

                <button class="post-action">
                    ↗ Partilhar
                </button>

                <button class="post-action delete-button">
                    🗑 Apagar
                </button>

            </div>

        `;


        post.querySelector(".post-text")
            .textContent = text;


        feed.prepend(post);


        addPostActions(post);


        postInput.value = "";

        postCategory.value = "Tudo";

        closeCreateModal();

    }
);


/* AÇÕES DAS PUBLICAÇÕES */

function addPostActions(post) {

    const likeButton =
        post.querySelector(".like-button");

    const deleteButton =
        post.querySelector(".delete-button");


    if (likeButton) {

        likeButton.addEventListener(
            "click",
            function() {

                this.classList.toggle("liked");

                if (this.classList.contains("liked")) {

                    this.textContent =
                        "♥ Gostei";

                } else {

                    this.textContent =
                        "♡ Gostar";

                }

            }
        );

    }


    if (deleteButton) {

        deleteButton.addEventListener(
            "click",
            function() {

                post.remove();

            }
        );

    }

}


/* ATIVAR LIKE NAS PUBLICAÇÕES EXISTENTES */

document
    .querySelectorAll(".post")
    .forEach(post => {

        addPostActions(post);

    });


/* FILTRO DE CATEGORIAS */

categories.forEach(button => {

    button.addEventListener(
        "click",
        function() {

            categories.forEach(
                b => b.classList.remove("active")
            );

            this.classList.add("active");


            const selected =
                this.dataset.category;


            document
                .querySelectorAll(".post")
                .forEach(post => {

                    if (
                        selected === "Tudo" ||
                        post.dataset.category === selected
                    ) {

                        post.style.display = "";

                    } else {

                        post.style.display = "none";

                    }

                });

        }
    );

});


/* PESQUISA */

const searchInput =
    document.getElementById("searchInput");

searchInput.addEventListener(
    "input",
    function() {

        const search =
            this.value.toLowerCase().trim();


        document
            .querySelectorAll(".post")
            .forEach(post => {

                const content =
                    post.textContent.toLowerCase();


                if (
                    content.includes(search)
                ) {

                    post.style.display = "";

                } else {

                    post.style.display = "none";

                }

            });

    }
);

</script>
