<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notebook</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #202124;
    height: 100vh;
    overflow: hidden;
}

/* APP */

.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 270px;
    background: #ffffff;
    border-right: 1px solid #e4e6eb;
    display: flex;
    flex-direction: column;
    padding: 20px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
}

.logo-icon {
    width: 42px;
    height: 48px;
    background: #222;
    border-radius: 6px 6px 4px 4px;
    position: relative;
    box-shadow: inset 5px 0 rgba(255,255,255,0.12);
}

.logo-icon::before {
    content: "";
    position: absolute;
    left: 8px;
    right: 8px;
    top: 10px;
    height: 2px;
    background: #fff;
    box-shadow:
        0 7px #fff,
        0 14px #fff,
        0 21px #fff;
}

.logo-text {
    font-size: 24px;
    font-weight: 700;
}

.new-note {
    border: none;
    background: #202124;
    color: white;
    padding: 13px;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    margin-bottom: 20px;
}

.new-note:hover {
    opacity: .9;
}

.search {
    width: 100%;
    padding: 12px;
    border: 1px solid #dddfe4;
    border-radius: 9px;
    outline: none;
    margin-bottom: 20px;
}

.section-title {
    font-size: 12px;
    color: #85888f;
    text-transform: uppercase;
    margin-bottom: 10px;
}

.notes-list {
    overflow-y: auto;
    flex: 1;
}

.note-item {
    padding: 12px;
    border-radius: 9px;
    cursor: pointer;
    margin-bottom: 5px;
}

.note-item:hover,
.note-item.active {
    background: #f0f1f3;
}

.note-title {
    font-weight: 600;
    font-size: 14px;
}

.note-preview {
    color: #888;
    font-size: 12px;
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.topbar {
    height: 65px;
    background: white;
    border-bottom: 1px solid #e4e6eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
}

.page-title {
    font-size: 18px;
    font-weight: 600;
}

.top-actions {
    display: flex;
    gap: 8px;
}

.top-button {
    border: none;
    background: #f1f2f4;
    padding: 9px 13px;
    border-radius: 8px;
    cursor: pointer;
}

.editor {
    flex: 1;
    overflow-y: auto;
    padding: 45px;
}

.editor-container {
    max-width: 900px;
    margin: auto;
}

.note-title-input {
    width: 100%;
    border: none;
    background: transparent;
    outline: none;
    font-size: 38px;
    font-weight: 700;
    margin-bottom: 20px;
}

.note-content {
    width: 100%;
    min-height: 500px;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    font-family: Arial, sans-serif;
    font-size: 17px;
    line-height: 1.7;
}

.empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #888;
    text-align: center;
}

.empty-icon {
    font-size: 65px;
    margin-bottom: 15px;
}

/* MOBILE */

.mobile-menu {
    display: none;
}

@media (max-width: 700px) {

    .sidebar {
        position: fixed;
        left: -280px;
        top: 0;
        bottom: 0;
        z-index: 10;
        transition: .25s;
    }

    .sidebar.open {
        left: 0;
    }

    .mobile-menu {
        display: block;
        border: none;
        background: transparent;
        font-size: 23px;
        cursor: pointer;
        margin-right: 10px;
    }

    .topbar {
        padding: 0 15px;
    }

    .editor {
        padding: 25px 18px;
    }

    .note-title-input {
        font-size: 30px;
    }

    .note-content {
        font-size: 16px;
    }

    .top-actions {
        display: none;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <div class="logo">
            <div class="logo-icon"></div>
            <div class="logo-text">Notebook</div>
        </div>

        <button class="new-note" onclick="createNote()">
            + Nova nota
        </button>

        <input
            class="search"
            id="search"
            placeholder="Pesquisar notas..."
            oninput="searchNotes()"
        >

        <div class="section-title">
            Minhas notas
        </div>

        <div class="notes-list" id="notesList"></div>

    </aside>

    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <div style="display:flex;align-items:center;">

                <button
                    class="mobile-menu"
                    onclick="toggleSidebar()">
                    ☰
                </button>

                <div class="page-title" id="topTitle">
                    Notebook
                </div>

            </div>

            <div class="top-actions">

                <button
                    class="top-button"
                    onclick="saveCurrentNote()">
                    💾 Guardar
                </button>

                <button
                    class="top-button"
                    onclick="deleteCurrentNote()">
                    🗑️
                </button>

            </div>

        </header>

        <section class="editor" id="editor">

            <div class="empty">

                <div>

                    <div class="empty-icon">📓</div>

                    <h2>Bem-vindo à Notebook</h2>

                    <p style="margin-top:8px;">
                        Cria uma nota para começar.
                    </p>

                    <button
                        class="new-note"
                        style="margin-top:20px;"
                        onclick="createNote()">
                        + Criar primeira nota
                    </button>

                </div>

            </div>

        </section>

    </main>

</div>

<script>

let notes = JSON.parse(localStorage.getItem("notebook_notes")) || [];

let currentNote = null;


/* GUARDAR */

function saveNotes() {
    localStorage.setItem(
        "notebook_notes",
        JSON.stringify(notes)
    );
}


/* CRIAR NOTA */

function createNote() {

    const note = {
        id: Date.now(),
        title: "Nova nota",
        content: ""
    };

    notes.unshift(note);

    saveNotes();

    currentNote = note.id;

    renderNotes();

    openNote(note.id);
}


/* MOSTRAR NOTAS */

function renderNotes() {

    const list = document.getElementById("notesList");

    list.innerHTML = "";

    notes.forEach(note => {

        const item = document.createElement("div");

        item.className =
            "note-item " +
            (note.id === currentNote ? "active" : "");

        item.onclick = () => openNote(note.id);

        item.innerHTML = `
            <div class="note-title">
                ${escapeHTML(note.title)}
            </div>

            <div class="note-preview">
                ${escapeHTML(note.content || "Nota vazia")}
            </div>
        `;

        list.appendChild(item);
    });
}


/* ABRIR NOTA */

function openNote(id) {

    currentNote = id;

    const note = notes.find(n => n.id === id);

    if (!note) return;

    document.getElementById("topTitle").textContent =
        note.title;

    document.getElementById("editor").innerHTML = `

        <div class="editor-container">

            <input
                class="note-title-input"
                id="noteTitle"
                value="${escapeHTML(note.title)}"
                placeholder="Título"
            >

            <textarea
                class="note-content"
                id="noteContent"
                placeholder="Começa a escrever..."
            >${escapeHTML(note.content)}</textarea>

        </div>

    `;

    document.getElementById("noteTitle")
        .addEventListener("input", updateCurrentNote);

    document.getElementById("noteContent")
        .addEventListener("input", updateCurrentNote);

    renderNotes();

    if (window.innerWidth <= 700) {
        document.getElementById("sidebar")
            .classList.remove("open");
    }
}


/* ATUALIZAR */

function updateCurrentNote() {

    const note = notes.find(n => n.id === currentNote);

    if (!note) return;

    note.title =
        document.getElementById("noteTitle").value ||
        "Nova nota";

    note.content =
        document.getElementById("noteContent").value;

    document.getElementById("topTitle").textContent =
        note.title;

    saveNotes();

    renderNotes();
}


/* GUARDAR */

function saveCurrentNote() {

    updateCurrentNote();

    alert("Nota guardada!");
}


/* APAGAR */

function deleteCurrentNote() {

    if (currentNote === null) return;

    const confirmDelete =
        confirm("Queres apagar esta nota?");

    if (!confirmDelete) return;

    notes =
        notes.filter(n => n.id !== currentNote);

    currentNote = null;

    saveNotes();

    renderNotes();

    document.getElementById("topTitle")
        .textContent = "Notebook";

    document.getElementById("editor").innerHTML = `

        <div class="empty">

            <div>

                <div class="empty-icon">📓</div>

                <h2>Nota apagada</h2>

                <p style="margin-top:8px;">
                    Cria uma nova nota para continuar.
                </p>

                <button
                    class="new-note"
                    style="margin-top:20px;"
                    onclick="createNote()">
                    + Nova nota
                </button>

            </div>

        </div>
    `;
}


/* PESQUISA */

function searchNotes() {

    const query =
        document.getElementById("search")
        .value.toLowerCase();

    const items =
        document.querySelectorAll(".note-item");

    items.forEach((item, index) => {

        const note = notes[index];

        const text =
            (note.title + " " + note.content)
            .toLowerCase();

        item.style.display =
            text.includes(query)
            ? "block"
            : "none";
    });
}


/* MENU MOBILE */

function toggleSidebar() {

    document.getElementById("sidebar")
        .classList.toggle("open");
}


/* SEGURANÇA HTML */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* INICIAR */

renderNotes();

</script>

</body>
</html>
